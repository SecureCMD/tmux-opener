name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      notarize:
        description: Sign and notarize (checks the signing secrets without releasing)
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    env:
      NOTARIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.notarize }}
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        if: env.NOTARIZE == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: scripts/ci-import-certificate.sh

      - name: Build universal app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ "$NOTARIZE" == "true" ]]; then
            scripts/build.sh --universal --zip --notarize
          else
            scripts/build.sh --universal --zip
          fi

      - name: Check bundle
        run: |
          lipo -info "build/Tmux Opener.app/Contents/MacOS/TmuxOpener"
          codesign --verify --verbose "build/Tmux Opener.app"
          codesign -d --entitlements - "build/Tmux Opener.app"

      - name: Lint Homebrew cask
        run: brew style Casks/tmux-opener.rb

      - uses: actions/upload-artifact@v4
        with:
          name: TmuxOpener
          path: build/TmuxOpener-*.zip

      - name: Remove signing keychain
        if: always() && env.NOTARIZE == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary_key.p8"
