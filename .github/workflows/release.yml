name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build.sh --universal --zip

      - name: Checksum
        run: |
          cd build
          shasum -a 256 TmuxOpener-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/TmuxOpener-*.zip build/SHA256SUMS.txt \
            --title "Tmux Opener ${{ github.ref_name }}" \
            --generate-notes

      - name: Update Homebrew cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "build/TmuxOpener-$VERSION.zip" | cut -d' ' -f1)
          git fetch origin main
          git checkout main
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            Casks/tmux-opener.rb
          git diff --quiet && exit 0
          git -c user.name="NachE" -c user.email="nache.nache@gmail.com" \
            commit -am "tmux-opener $VERSION"
          git push origin main
