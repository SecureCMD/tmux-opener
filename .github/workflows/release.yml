name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build.sh --universal --zip

      - name: Checksum
        run: |
          cd build
          shasum -a 256 TmuxOpener-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/TmuxOpener-*.zip build/SHA256SUMS.txt \
            --title "Tmux Opener ${{ github.ref_name }}" \
            --generate-notes
