name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      # Sign and notarize only when all secrets are configured; ad-hoc otherwise.
      CAN_SIGN: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        if: env.CAN_SIGN == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: scripts/ci-import-certificate.sh

      - name: Build universal app
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ "$CAN_SIGN" == "true" ]]; then
            scripts/build.sh --universal --zip --notarize
          else
            echo "::warning::Signing secrets not set; publishing an ad-hoc signed build."
            scripts/build.sh --universal --zip
          fi

      - name: Checksum
        run: |
          cd build
          shasum -a 256 TmuxOpener-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/TmuxOpener-*.zip build/SHA256SUMS.txt \
            --title "Tmux Opener ${{ github.ref_name }}" \
            --generate-notes

      - name: Update Homebrew cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "build/TmuxOpener-$VERSION.zip" | cut -d' ' -f1)
          git fetch origin main
          git checkout main
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            Casks/tmux-opener.rb
          git diff --quiet && exit 0
          git -c user.name="NachE" -c user.email="nache.nache@gmail.com" \
            commit -am "tmux-opener $VERSION"
          git push origin main

      - name: Remove signing keychain
        if: always() && env.CAN_SIGN == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary_key.p8"
